# Business Flights Travel website — self-hosted production deployment: OVHcloud VPS + Docker Compose + Cloudflare Tunnel.
# Full guide (read it before the first deploy): docs/DEPLOYMENT_VPS.md.   Deploy: deploy/deploy.sh (see the guide).
#
# THIS IS A SEPARATE COMPOSE PROJECT. It defines exactly ONE service, `bft-web`. It does not define, start, stop or recreate PostgreSQL,
# the Compass Tools CRM or the Cloudflare Tunnel connector — those belong to the CRM's own compose project (`compass-tools`) and are
# never touched by any command in this file's directory (every command in the guide uses `-p business-flights-travel` and names only
# `bft-web`).
#
# THE WEBSITE HAS NO DATABASE. It sends every form to the Compass Tools CRM over HTTP (docs/CRM_API_INTEGRATION.md) and holds no database
# URL, credential, driver or network route to PostgreSQL.
#
# What it needs from the host: TWO external networks that the CRM project already owns. Compose never creates them and separate projects
# do NOT share networks automatically: if a name is wrong, `up` fails with "network ... declared as external, but could not be found"
# instead of silently creating an empty network.
#   crm_api   `compass-tools-website-api` — an `internal: true` network that carries the CRM app (answering as http://compass-crm:3000)
#             and nothing else: not PostgreSQL, not the tunnel. It is how the website reaches the CRM's API.
#   tunnel    `compass-tools_web` — the network the Cloudflare Tunnel connector (`cloudflared`) is on, so the tunnel's public hostname for
#             this site can point at http://bft-web:3000. It must NOT be a network that also carries PostgreSQL: deploy/preflight.sh
#             refuses to continue if any container on either network answers to the name `db`.
#
# Because those networks are shared, the service name and alias are deliberately unique and project-prefixed. Docker DNS answers a name from
# EVERY container that carries it, so this service must never be called `app`, `db`, `web` or `cloudflared`, and it must not add aliases
# other than `bft-web`. deploy/preflight.sh checks for a collision before every deploy.
#
# Nothing is published on the host. There is no `ports:` here and there must never be: the only way to reach the site is through the
# tunnel, which is also what makes TRUSTED_PROXY=cloudflare safe (a reachable port would let a client forge CF-Connecting-IP).
#
# Secrets come from the protected .env file next to this file (copy .env.vps.example, `chmod 600 .env`). Each variable is passed
# explicitly below — the container receives only what the site reads.

name: business-flights-travel

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  bft-web:
    image: business-flights-web:${APP_VERSION:-local}
    build:
      context: .
      target: runner
    restart: unless-stopped
    # PID 1 is a tiny init (tini): correct SIGTERM handling for `docker stop` (graceful 20 s window) and zombie reaping.
    init: true
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      # --- the Compass Tools CRM, over the private `crm_api` network (docs/CRM_API_INTEGRATION.md) ---
      CRM_API_URL: ${CRM_API_URL:-http://compass-crm:3000}
      # The CRM's WEBSITE_API_KEY (>= 32 characters). Bearer credential for POST /api/v1/website/flight-inquiries. Never NEXT_PUBLIC_*.
      CRM_API_KEY: ${CRM_API_KEY:?Set CRM_API_KEY in .env (the same value as the CRM's WEBSITE_API_KEY)}
      # The CRM Company id the contact form and the newsletter sign-up are filed under (the CRM's public endpoints take it in the body).
      CRM_COMPANY_ID: ${CRM_COMPANY_ID:?Set CRM_COMPANY_ID in .env (the CRM's WEBSITE_API_COMPANY_ID)}
      # Optional: signs the visitor's IP / approximate location so the CRM can record them. Identical to the CRM's LEAD_INGEST_SECRET.
      LEAD_INGEST_SECRET: ${LEAD_INGEST_SECRET:-}
      # --- visitor IP: the origin is reachable only through cloudflared, which carries Cloudflare's CF-Connecting-IP ---
      TRUSTED_PROXY: cloudflare
      # --- notification email (Gmail SMTP, one sender address, app password) ---
      GMAIL_SENDER_EMAIL: ${GMAIL_SENDER_EMAIL:?Set GMAIL_SENDER_EMAIL in .env}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:?Set GMAIL_APP_PASSWORD in .env}
    # No `ports:` — see the header. `expose` only documents the port for other containers on the shared network.
    expose:
      - "3000"
    networks:
      # This project's own network: gives the container outbound internet (Gmail SMTP, images.unsplash.com for next/image), which the
      # CRM's internal networks do not have.
      default: {}
      crm_api: {}
      # The alias is unique on purpose: the tunnel's Service URL is http://bft-web:3000.
      tunnel:
        aliases: [bft-web]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    # The V8 heap is capped at 768 MB (NODE_OPTIONS in the Dockerfile); the container limit leaves room for buffers, sharp/libvips and the
    # runtime itself, so the cap triggers garbage collection before the kernel OOM-kills the container.
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 20s
    # HEALTHCHECK is defined in the image (scripts/healthcheck.mjs -> GET /api/health, which deliberately does not call the CRM).
    logging: *default-logging

networks:
  default: {}
  crm_api:
    external: true
    name: ${CRM_API_NETWORK_NAME:-compass-tools-website-api}
  tunnel:
    external: true
    name: ${TUNNEL_NETWORK_NAME:-compass-tools_web}
