# Business Flights Travel website — self-hosted production deployment: OVHcloud VPS + Docker Compose + Cloudflare Tunnel.
# Full guide (read it before the first deploy): docs/DEPLOYMENT_VPS.md.   Deploy: deploy/deploy.sh (see the guide).
#
# THIS IS A SEPARATE COMPOSE PROJECT. It defines exactly ONE service, `bft-web`. It does not define, start, stop or recreate PostgreSQL,
# the Compass Tools CRM or the Cloudflare Tunnel connector — those belong to the CRM's own compose project (`compass-tools`) and are
# never touched by any command in this file's directory (every command in the guide uses `-p business-flights-travel` and names only
# `bft-web`).
#
# What it needs from the host: ONE external network, the CRM project's `compass-tools_internal`, which already carries the CRM app, its
# PostgreSQL (`db`) and the Cloudflare connector (`cloudflared`). Joining it is what lets (a) the website reach `db` and (b) the tunnel reach
# `http://bft-web:3000`. Compose never creates it and separate projects do NOT share networks automatically: if the name is wrong,
# `up` fails with "network ... declared as external, but could not be found" instead of silently creating an empty network.
#
# Because that network is shared and flat, the service name and alias are deliberately unique and project-prefixed. Docker DNS answers a
# name from EVERY container that carries it, so this service must never be called `app`, `db`, `web` or `cloudflared`, and it must not
# add aliases other than `bft-web`. deploy/preflight.sh checks for a collision before every deploy.
#
# Nothing is published on the host. There is no `ports:` here and there must never be: the only way to reach the site is through the
# tunnel, which is also what makes TRUSTED_PROXY=cloudflare safe (a reachable port would let a client forge CF-Connecting-IP).
#
# Secrets come from the protected .env file next to this file (copy .env.vps.example, `chmod 600 .env`). Each variable is passed
# explicitly below — the container receives only what the site reads.

name: business-flights-travel

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  bft-web:
    image: business-flights-web:${APP_VERSION:-local}
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      # --- database: the CRM's PostgreSQL, over the private Docker network (see docs/DEPLOYMENT_VPS.md, "Database") ---
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env (postgresql://<runtime role>:<password>@db:5432/<database>)}
      # Plain TCP is correct ONLY on the private network and ONLY for the host `db`: src/lib/db-tls.ts refuses "disable" for any other
      # host. For a remote/managed database unset this and set DATABASE_SSL_CA (verified TLS) instead.
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-disable}
      DATABASE_SSL_CA: ${DATABASE_SSL_CA:-}
      DATABASE_SSL_VERIFY: ${DATABASE_SSL_VERIFY:-}
      # The website must NEVER create or alter schema. The CRM owns the schema and its migrations. A value other than the exact string
      # "true" keeps the schema guard read-only; it is fixed here so a stray shell variable cannot turn it on.
      DATABASE_AUTO_INIT: "false"
      # --- visitor IP: the origin is reachable only through cloudflared, which carries Cloudflare's CF-Connecting-IP ---
      TRUSTED_PROXY: cloudflare
      # --- notification email (Gmail SMTP, one sender address, app password) ---
      GMAIL_SENDER_EMAIL: ${GMAIL_SENDER_EMAIL:?Set GMAIL_SENDER_EMAIL in .env}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:?Set GMAIL_APP_PASSWORD in .env}
    # No `ports:` — see the header. `expose` only documents the port for other containers on the shared network.
    expose:
      - "3000"
    networks:
      # This project's own network: gives the container outbound internet (Gmail SMTP, images.unsplash.com for next/image), which the
      # CRM's network may not have.
      default: {}
      # The CRM project's network. The alias is unique on purpose: the tunnel's Service URL is http://bft-web:3000 and the database is `db`.
      crm_internal:
        aliases: [bft-web]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 20s
    # HEALTHCHECK is defined in the image (scripts/healthcheck.mjs -> GET /api/health, which deliberately does not touch the database).
    logging: *default-logging

networks:
  default: {}
  crm_internal:
    external: true
    name: ${CRM_NETWORK_NAME:-compass-tools_internal}
